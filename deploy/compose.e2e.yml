# Overlay for the nightly compose test (S-068): adds the seeded fixture sites the workers run against.
#
#   docker compose -f deploy/compose.team.yml -f deploy/compose.e2e.yml up -d --build --wait
#   node deploy/compose-e2e.mjs
services:
  fixtures:
    image: s1pilot/server:local
    entrypoint: ["node", "/app/fixtures/sites/dist/dev.js"]
    environment:
      PORT: "4400"
      FIXTURE_HOST: 0.0.0.0
    depends_on:
      - server
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/shop').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
  worker-1:
    depends_on:
      fixtures:
        condition: service_healthy
  worker-gpu:
    depends_on:
      fixtures:
        condition: service_healthy
